<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senza Fretta - Menù</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f3e3c8;
      --title-color: #d98428;
      --category-color: #d98428;
      --dish-color: #52632d;
      --price-color: #52632d;
      --ingredients-color: #52632d;
      --font-family: 'Gluten', cursive, sans-serif;
      --menu-title-size: 38px;
      --category-size: 26px;
      --dish-size: 18px;
      --price-size: 18px;
      --ingredients-size: 14px;
      /* Altezza della barra fissa in stato compatto (aggiornata via JS) */
      --compact-h: 150px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); font-family: var(--font-family); color: var(--dish-color); line-height: 1.4; padding-bottom: 60px; }

    /* Trama di sfondo con parallasse: scorre più lentamente del contenuto */
    #bg-pattern { position: fixed; top: -240px; left: 0; width: 100%; height: calc(100% + 480px); z-index: -1; pointer-events: none; background-image: url("pattern.svg"); background-size: 240px 240px; background-repeat: repeat; will-change: transform; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }

    /* Barra superiore fissa: contiene logo + titolo + menù categorie.
       Essendo un unico blocco, i due elementi non possono mai sovrapporsi. */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: var(--bg-color);
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    /* Spazio che compensa l'altezza della barra fissa (impostato via JS) */
    #top-spacer { height: 170px; }

    .header { text-align: center; padding: 12px 16px 4px 16px; transition: padding 0.3s ease; }
    .logo-img { max-width: 220px; width: 100%; height: auto; display: block; margin: 0 auto 6px auto; transition: max-width 0.3s ease; }
    .main-title { font-size: 28px; color: var(--title-color); text-transform: uppercase; letter-spacing: 2px; transition: font-size 0.3s ease; }

    /* Stato compatto quando si scorre la pagina */
    body.scrolled .header { padding: 6px 16px 2px 16px; }
    body.scrolled .logo-img { max-width: 120px; margin-bottom: 2px; }
    body.scrolled .main-title { font-size: 18px; }

    .category-nav-wrapper { background-color: var(--bg-color); padding: 8px 16px; }
    .category-nav { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; max-width: 700px; margin: 0 auto; }
    .category-nav::-webkit-scrollbar { display: none; }
    .cat-link { flex: 0 0 auto; background-color: rgba(217, 132, 40, 0.15); color: var(--category-color); padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid var(--category-color); }

    .macro-category { margin-top: 32px; margin-bottom: 32px; scroll-margin-top: calc(var(--compact-h) + 8px); }
    .category-header { font-size: var(--category-size); color: var(--category-color); text-transform: uppercase; border-bottom: 2px solid var(--category-color); padding-bottom: 6px; margin-bottom: 16px; }
    .dish-item { margin-bottom: 18px; }
    .dish-header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .dish-name { font-size: var(--dish-size); color: var(--dish-color); flex: 1; text-transform: uppercase; }
    .dish-price { font-size: var(--price-size); color: var(--price-color); white-space: nowrap; }
    .dish-ingredients { font-size: var(--ingredients-size); color: var(--ingredients-color); margin-top: 4px; opacity: 0.9; }

    .box-container { margin-bottom: 24px; font-size: 14px; line-height: 1.5; scroll-margin-top: calc(var(--compact-h) + 8px); }
    .box-bordered { background-color: rgba(255, 255, 255, 0.4); border: 1px solid var(--title-color); border-radius: 12px; padding: 16px 20px; text-align: center; }
    .box-plain { padding: 10px 0; text-align: center; }
    /* Elimina eventuali sfondi/evidenziazioni ereditati dal testo incollato (es. da Word, Google Docs, siti web) */
    .box-body, .box-body * { background: transparent !important; background-color: transparent !important; }

    .ciccio-custom-section { margin-bottom: 32px; scroll-margin-top: calc(var(--compact-h) + 8px); }
    .ciccio-box { width: 100%; background: rgba(255, 255, 255, 0.4); border: 1px solid var(--title-color); border-radius: 12px; padding: 16px; margin-top: 16px; overflow: hidden; }
    .ciccio-intro { font-size: 15px; font-weight: bold; color: var(--title-color); text-transform: uppercase; margin-bottom: 12px; text-align: center; }

    /* Griglia a 3 colonne: minmax(0, 1fr) impedisce alle colonne di allargarsi oltre il riquadro */
    .ciccio-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; align-items: start; width: 100%; margin: 0 auto; }
    .ciccio-item { font-size: 13px; display: flex; justify-content: space-between; gap: 4px; min-width: 0; }
    .ciccio-item .dish-name { font-size: 13px; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
    .ciccio-item .dish-price { font-size: 13px; }
    .empty-msg { text-align: center; font-style: italic; margin-top: 40px; opacity: 0.8; }

    /* Mobile: nome e prezzo in colonna, centrati, così tutto resta dentro il riquadro */
    @media (max-width: 600px) {
      .ciccio-box { padding: 14px 10px; }
      .ciccio-grid { gap: 12px 8px; }
      .ciccio-item { flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: 2px; }
      .ciccio-item .dish-name { flex: none; font-size: 11px; line-height: 1.25; text-align: center; width: 100%; }
      .ciccio-item .dish-price { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="bg-pattern" aria-hidden="true"></div>
  <div class="top-bar" id="top-bar">
    <header class="header">
      <img id="menu-logo" class="logo-img" src="SENZA FRETTA LOGO ORIZZONTALE.png" alt="Senza Fretta Logo">
      <h1 class="main-title">MENÙ</h1>
    </header>

    <div class="category-nav-wrapper">
      <nav class="category-nav" id="category-nav-links"></nav>
    </div>
  </div>
  <div id="top-spacer"></div>

  <div class="container">
    <main id="menu-content">
      <div class="empty-msg">Caricamento menù in corso...</div>
    </main>
  </div>

  <script>
    const BIN_ID = "6acdf4c6ac6210605a2d027e";
    const API_KEY = "$2a$10$D6x0TfYD9PWKxlYRBVPw3OgUPIunR5a2qDZdw9Lsw7jZ7d611Qu/6";

    const topBar = document.getElementById('top-bar');
    const topSpacer = document.getElementById('top-spacer');

    // Allinea lo spazio sotto la barra fissa alla sua altezza reale
    // (spazio fisso = altezza espansa; --compact-h = altezza compatta per gli scroll sulle sezioni)
    function syncBarHeights() {
      const h = topBar.offsetHeight;
      if (document.body.classList.contains('scrolled')) {
        document.documentElement.style.setProperty('--compact-h', h + 'px');
      } else {
        topSpacer.style.height = h + 'px';
      }
    }
    if (window.ResizeObserver) new ResizeObserver(syncBarHeights).observe(topBar);
    window.addEventListener('resize', syncBarHeights);
    window.addEventListener('load', syncBarHeights);
    document.getElementById('menu-logo').addEventListener('load', syncBarHeights);
    syncBarHeights();


    // Parallasse della trama: si muove al 35% della velocità di scroll.
    // Il modulo 240 (lato della piastrella) rende il loop senza salti.
    (function() {
      const bg = document.getElementById('bg-pattern');
      const TILE = 240, SPEED = 0.35;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let ticking = false;
      function update() {
        const y = -((window.scrollY * SPEED) % TILE);
        bg.style.transform = 'translate3d(0,' + y + 'px,0)';
        ticking = false;
      }
      window.addEventListener('scroll', function() {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
      update();
    })();

    // Gestione effetto rimpicciolimento header allo scroll
    window.addEventListener('scroll', function() {
      if (window.scrollY > 40) {
        document.body.classList.add('scrolled');
      } else {
        document.body.classList.remove('scrolled');
      }
    });

    async function loadMenu() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${new Date().getTime()}`, {
          method: 'GET',
          headers: { 'X-Master-Key': API_KEY }
        });
        const json = await res.json();
        
        const appData = json.record || json;
        const menuContainer = document.getElementById('menu-content');
        const navContainer = document.getElementById('category-nav-links');
        
        menuContainer.innerHTML = '';
        navContainer.innerHTML = '';

        if (!appData.menu || appData.menu.length === 0) {
          menuContainer.innerHTML = '<div class="empty-msg">Il menù è attualmente vuoto.</div>';
          return;
        }

        if (appData.config) {
          const cfg = appData.config;
          const root = document.documentElement;
          if(cfg.bgColor) root.style.setProperty('--bg-color', cfg.bgColor);
          if(cfg.titleColor) {
            root.style.setProperty('--title-color', cfg.titleColor);
            root.style.setProperty('--category-color', cfg.titleColor);
          }
          if(cfg.dishColor) {
            root.style.setProperty('--dish-color', cfg.dishColor);
            root.style.setProperty('--price-color', cfg.dishColor);
          }
          if(cfg.fontFamily) root.style.setProperty('--font-family', cfg.fontFamily);
        }

        appData.menu.forEach((group, index) => {
          const catId = 'item-' + index;

          if (group.type === 'textbox' || group.type === 'allergen') {
            const hasBorder = group.showBorder !== false;
            const boxDiv = document.createElement('div');
            boxDiv.className = `box-container ${hasBorder ? 'box-bordered' : 'box-plain'}`;
            boxDiv.id = catId;

            boxDiv.innerHTML = `
              ${group.title ? `<strong style="display:block; margin-bottom:8px; text-transform:uppercase; font-size:16px;">${group.title}</strong>` : ''}
              <div class="box-body">${group.content}</div>
            `;
            menuContainer.appendChild(boxDiv);
            return;
          }

          if (group.type === 'cicciogrid') {
            const ciccioSection = document.createElement('section');
            ciccioSection.className = 'ciccio-custom-section';
            ciccioSection.id = catId;

            let items = group.items || [];
            if(items.length === 0 && (group.col1 || group.col2 || group.col3)) {
              items = [...(group.col1 || []), ...(group.col2 || []), ...(group.col3 || [])];
            }

            let itemsHtml = items.map(i => `
              <div class="ciccio-item">
                <span class="dish-name">${i.name}</span>
                ${i.price ? `<span class="dish-price">${i.price} €</span>` : ''}
              </div>
            `).join('');

            ciccioSection.innerHTML = `
              <div class="ciccio-box">
                <div class="ciccio-intro">${group.title || 'COMPONI IL TUO CICCIO'}</div>
                <div class="ciccio-grid">
                  ${itemsHtml}
                </div>
              </div>
            `;
            menuContainer.appendChild(ciccioSection);
            
            // Aggiungiamo il link di navigazione rapida anche per la sezione Ciccio
            const navLink = document.createElement('a');
            navLink.className = 'cat-link';
            navLink.href = '#' + catId;
            navLink.innerText = group.title || 'CICCIO';
            navContainer.appendChild(navLink);
            return;
          }

          if (!group.dishes || group.dishes.length === 0) return;

          const navLink = document.createElement('a');
          navLink.className = 'cat-link';
          navLink.href = '#' + catId;
          navLink.innerText = group.category;
          navContainer.appendChild(navLink);

          const catSection = document.createElement('section');
          catSection.className = 'macro-category';
          catSection.id = catId;

          let dishesHtml = '';
          group.dishes.forEach(dish => {
            dishesHtml += `
              <div class="dish-item">
                <div class="dish-header">
                  <span class="dish-name">${dish.name}</span>
                  <span class="dish-price">${dish.price} €</span>
                </div>
                ${dish.ingredients ? `<div class="dish-ingredients">${dish.ingredients}</div>` : ''}
              </div>
            `;
          });

          catSection.innerHTML = `<h2 class="category-header">${group.category}</h2>${dishesHtml}`;
          menuContainer.appendChild(catSection);
        });

        syncBarHeights();

      } catch (e) {
        console.error("Errore caricamento menù", e);
        document.getElementById('menu-content').innerHTML = '<div class="empty-msg">Impossibile caricare il menù al momento.</div>';
      }
    }

    loadMenu();
  </script>
</body>
</html>
