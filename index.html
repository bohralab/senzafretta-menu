<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senza Fretta - Menù</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f3e3c8;
      --title-color: #d98428;
      --category-color: #d98428;
      --dish-color: #52632d;
      --price-color: #52632d;
      --ingredients-color: #52632d;
      --font-family: 'Gluten', cursive, sans-serif;
      --menu-title-size: 38px;
      --category-size: 26px;
      --dish-size: 18px;
      --price-size: 18px;
      --ingredients-size: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); font-family: var(--font-family); color: var(--dish-color); line-height: 1.4; padding-bottom: 60px; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
    .header { text-align: center; margin-bottom: 24px; }
    .logo-img { max-width: 280px; width: 100%; height: auto; display: block; margin: 0 auto 12px auto; }
    .main-title { font-size: var(--menu-title-size); color: var(--title-color); text-transform: uppercase; letter-spacing: 2px; }
    
    .box-container { margin-bottom: 24px; font-size: 14px; line-height: 1.5; }
    .box-bordered { background-color: rgba(255, 255, 255, 0.4); border: 1px solid var(--title-color); border-radius: 12px; padding: 16px 20px; text-align: center; }
    .box-plain { padding: 10px 0; text-align: center; }

    .category-nav-wrapper { position: sticky; top: 0; background-color: var(--bg-color); padding: 10px 0; z-index: 100; margin-bottom: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .category-nav { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .cat-link { background-color: rgba(217, 132, 40, 0.15); color: var(--category-color); padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: 600; border: 1px solid var(--category-color); }
    .macro-category { margin-bottom: 32px; }
    .category-header { font-size: var(--category-size); color: var(--category-color); text-transform: uppercase; border-bottom: 2px solid var(--category-color); padding-bottom: 6px; margin-bottom: 16px; }
    .dish-item { margin-bottom: 18px; }
    .dish-header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .dish-name { font-size: var(--dish-size); color: var(--dish-color); flex: 1; text-transform: uppercase; }
    .dish-price { font-size: var(--price-size); color: var(--price-color); white-space: nowrap; }
    .dish-ingredients { font-size: var(--ingredients-size); color: var(--ingredients-color); margin-top: 4px; opacity: 0.9; }
    
    .ciccio-custom-section { margin-bottom: 32px; }
    .ciccio-box { background: rgba(255, 255, 255, 0.4); border: 1px solid var(--title-color); border-radius: 12px; padding: 16px; margin-top: 16px; }
    .ciccio-intro { font-size: 15px; font-weight: bold; color: var(--title-color); text-transform: uppercase; margin-bottom: 12px; text-align: center; }
    .ciccio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .ciccio-item { font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
    .empty-msg { text-align: center; font-style: italic; margin-top: 40px; opacity: 0.8; }

    @media (max-width: 600px) {
      .ciccio-grid { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img id="menu-logo" class="logo-img" src="SENZA FRETTA LOGO ORIZZONTALE.png" alt="Senza Fretta Logo">
      <h1 class="main-title">MENÙ</h1>
    </header>

    <div class="category-nav-wrapper">
      <nav class="category-nav" id="category-nav-links"></nav>
    </div>

    <main id="menu-content">
      <div class="empty-msg">Caricamento menù in corso...</div>
    </main>
  </div>

  <script>
    const BIN_ID = "6acdf4c6ac6210605a2d027e";
    const API_KEY = "$2a$10$D6x0TfYD9PWKxlYRBVPw3OgUPIunR5a2qDZdw9Lsw7jZ7d611Qu/6";

    async function loadMenu() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${new Date().getTime()}`, {
          method: 'GET',
          headers: { 'X-Master-Key': API_KEY }
        });
        const json = await res.json();
        
        const appData = json.record || json;
        const menuContainer = document.getElementById('menu-content');
        const navContainer = document.getElementById('category-nav-links');
        
        menuContainer.innerHTML = '';
        navContainer.innerHTML = '';

        if (!appData.menu || appData.menu.length === 0) {
          menuContainer.innerHTML = '<div class="empty-msg">Il menù è attualmente vuoto.</div>';
          return;
        }

        if (appData.config) {
          const cfg = appData.config;
          const root = document.documentElement;
          if(cfg.bgColor) root.style.setProperty('--bg-color', cfg.bgColor);
          if(cfg.titleColor) {
            root.style.setProperty('--title-color', cfg.titleColor);
            root.style.setProperty('--category-color', cfg.titleColor);
          }
          if(cfg.dishColor) {
            root.style.setProperty('--dish-color', cfg.dishColor);
            root.style.setProperty('--price-color', cfg.dishColor);
          }
          if(cfg.fontFamily) root.style.setProperty('--font-family', cfg.fontFamily);
        }

        appData.menu.forEach((group, index) => {
          const catId = 'item-' + index;

          if (group.type === 'textbox' || group.type === 'allergen') {
            const hasBorder = group.showBorder !== false;
            const boxDiv = document.createElement('div');
            boxDiv.className = `box-container ${hasBorder ? 'box-bordered' : 'box-plain'}`;

            boxDiv.innerHTML = `
              ${group.title ? `<strong style="display:block; margin-bottom:8px; text-transform:uppercase; font-size:16px;">${group.title}</strong>` : ''}
              <div class="box-body">${group.content}</div>
            `;
            menuContainer.appendChild(boxDiv);
            return;
          }

          if (group.type === 'cicciogrid') {
            const ciccioSection = document.createElement('section');
            ciccioSection.className = 'ciccio-custom-section';
            ciccioSection.id = catId;

            let col1Html = (group.col1 || []).map(i => `<div class="ciccio-item"><span class="dish-name">${i.name}</span>${i.price ? `<span class="dish-price">${i.price} €</span>` : ''}</div>`).join('');
            let col2Html = (group.col2 || []).map(i => `<div class="ciccio-item"><span class="dish-name">${i.name}</span>${i.price ? `<span class="dish-price">${i.price} €</span>` : ''}</div>`).join('');
            let col3Html = (group.col3 || []).map(i => `<div class="ciccio-item"><span class="dish-name">${i.name}</span>${i.price ? `<span class="dish-price">${i.price} €</span>` : ''}</div>`).join('');

            ciccioSection.innerHTML = `
              <div class="ciccio-box">
                <div class="ciccio-intro">${group.title || 'COMPONI IL TUO CICCIO'}</div>
                <div class="ciccio-grid">
                  <div>${col1Html}</div>
                  <div>${col2Html}</div>
                  <div>${col3Html}</div>
                </div>
              </div>
            `;
            menuContainer.appendChild(ciccioSection);
            return;
          }

          if (!group.dishes || group.dishes.length === 0) return;

          const navLink = document.createElement('a');
          navLink.className = 'cat-link';
          navLink.href = '#' + catId;
          navLink.innerText = group.category;
          navContainer.appendChild(navLink);

          const catSection = document.createElement('section');
          catSection.className = 'macro-category';
          catSection.id = catId;

          let dishesHtml = '';
          group.dishes.forEach(dish => {
            dishesHtml += `
              <div class="dish-item">
                <div class="dish-header">
                  <span class="dish-name">${dish.name}</span>
                  <span class="dish-price">${dish.price} €</span>
                </div>
                ${dish.ingredients ? `<div class="dish-ingredients">${dish.ingredients}</div>` : ''}
              </div>
            `;
          });

          catSection.innerHTML = `<h2 class="category-header">${group.category}</h2>${dishesHtml}`;
          menuContainer.appendChild(catSection);
        });

      } catch (e) {
        console.error("Errore caricamento menù", e);
        document.getElementById('menu-content').innerHTML = '<div class="empty-msg">Impossibile caricare il menù al momento.</div>';
      }
    }

    loadMenu();
  </script>
</body>
</html>
